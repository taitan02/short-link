name: Release images

# Builds and pushes images for the apps a push to main affected. Deploying them is a separate,
# manual step (deploy.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Build every image, regardless of what changed
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read
  packages: write

jobs:
  affected:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.detect.outputs.api }}
      worker: ${{ steps.detect.outputs.worker }}
      migrate: ${{ steps.detect.outputs.migrate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: detect
        env:
          # Empty base (manual "all" run) means build everything.
          BASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.all) && '' || github.event.before }}
        run: .github/scripts/affected.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

  image:
    name: Push ${{ matrix.target }}
    needs: affected
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, migrate]
    steps:
      - id: run
        run: echo "build=${{ needs.affected.outputs[matrix.target] }}" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Multi-arch, so the image matches the server whatever its CPU (the Prisma schema engine
      # in the migrate image is a native binary).
      - if: steps.run.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.run.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.run.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.run.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/short-link-${{ matrix.target }}
          # sha-<short> is what deployments pin; `main` is a moving convenience tag.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - if: steps.run.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}
          provenance: true
          sbom: true
