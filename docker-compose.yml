# Local development infrastructure only. Production configuration lives in deploy/.
name: short-link

services:
  postgres:
    image: postgres:18.6-alpine
    # pg_stat_statements: per-query timing for the slow-query runbook (docs/operations.md).
    # random_page_cost 1.1 suits SSDs; the default 4 made the planner sort deep listing pages
    # instead of walking the index (docs/performance.md). Statements over 250 ms are logged.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=250
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shortlink -d shortlink']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    # noeviction + AOF because BullMQ (Phase 4) shares this instance in dev and must never lose
    # or silently evict queue keys. Every cache and rate-limit key carries a TTL, so they still
    # expire on their own. Production splits cache and queue (see README).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6389}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
