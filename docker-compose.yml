# Local development infrastructure only. Production configuration lives in deploy/.
name: short-link

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shortlink -d shortlink']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # noeviction + AOF because BullMQ (Phase 4) shares this instance in dev and must never lose
    # or silently evict queue keys. Every cache and rate-limit key carries a TTL, so they still
    # expire on their own. Production splits cache and queue (see README).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6389}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
